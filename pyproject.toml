[project]
name = "astro-blaster"
version = "0.1.0"
description = "Jeu de tir spatial en Python (pygame-ce) : un vaisseau, des météorites, des explosions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TeeBo8", email = "contact@teebostudio.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
astro-blaster = "astro_blaster:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pygbag>=0.9.3",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F : erreurs de base, I : ordre des imports, UP : syntaxe Python récente,
# B : bugs probables, SIM : simplifications, N : nommage
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
